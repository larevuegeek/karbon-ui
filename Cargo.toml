[package]
name = "karbon-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native desktop UI library for Rust: HTML templates and CSS compiled to native widgets, no webview (Windows, macOS, Linux)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gui", "ui", "native", "desktop", "templates"]
categories = ["gui"]
# Hors du paquet crates.io : documentation interne, outillage, CI et sorties locales (les
# exemples et les ressources de tests restent, pour que `cargo test` du paquet passe).
exclude = ["docs/", "tools/", ".github/", ".vscode/", "CLAUDE.md", "artifacts/"]

[dependencies]
# Version commune du dépôt ([workspace.dependencies]) ; la crate de macros est publiée
# en premier.
karbon-ui-macros.workspace = true

# Suite native du backend macOS : AppKit exige le thread principal, la crate fournit son
# propre `main` (sans harnais de test).
[[test]]
name = "macos"
path = "tests/macos/main.rs"
harness = false

[workspace]
members = ["crates/ui-macros", "crates/updater"]
resolver = "3"

# Une seule version pour les trois crates (karbon-ui, karbon-ui-macros, karbon-updater) :
# les corrections restent dans la branche 0.3.x (0.3.1, 0.3.2…). Pour publier une version,
# changer `version` ici et celle de `karbon-ui-macros` juste en dessous.
[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/larevuegeek/karbon-ui"

[workspace.dependencies]
# `version` sert à crates.io, `path` au développement.
karbon-ui-macros = { path = "crates/ui-macros", version = "0.3.1" }

# Liaisons officielles Microsoft (windows-rs), générées depuis les métadonnées du SDK.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "0.62"
windows-numerics = "0.3"

# Backend Linux : liaisons C écrites à la main (Cairo, Pango, fontconfig, FreeType,
# gdk-pixbuf, GLib) ; `libc` pour `memfd_create` et `getrusage`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Liaisons Apple de la famille objc2 (accord du 2026-11-04) : seuls les modules utilisés
# sont activés. `bitflags` est une dépendance transitive imposée par ces crates.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSGeometry",
    "NSLocale",
    "NSNotification",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSAttributedString",
    "NSString",
    "NSThread",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "objc2-uniform-type-identifiers",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSCursor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTextInputClient",
    "NSTextInputContext",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-metal",
    "CAMetalLayer",
    "CALayer",
    "CATransaction",
    "CADisplayLink",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLGPUAddress",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFAttributedString",
    "CFCGTypes",
    "CFCharacterSet",
    "CFData",
    "CFDictionary",
    "CFError",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGAffineTransform",
    "CGBase",
    "CGBitmapContext",
    "CGColor",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
