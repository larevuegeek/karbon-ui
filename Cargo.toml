objc2-image-io = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-graphics",
    "CGImageDestination",
    "CGImageProperties",
    "CGImageSource",
] }
# Dialogues de fichiers : types de fichiers proposés (`UTType`) et fin de la feuille
# (bloc Objective-C).
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = [
    "std",
    "UTType",
] }
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
